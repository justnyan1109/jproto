[pytest]
testpaths = tests
addopts = -q
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s.%(msecs)03d %(levelname)-7s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
log_file = pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s.%(msecs)03d %(levelname)-7s %(name)s %(filename)s:%(lineno)d: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
